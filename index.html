<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistemas — Colegio San Carlos</title>
<meta name="description" content="Panel de acceso rápido a las aplicaciones del Colegio San Carlos.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2300476C'/><text x='50' y='72' font-size='52' font-family='Georgia,serif' text-anchor='middle' fill='%23ffffff'>SC</text></svg>">
<style>
  /* ===========================================================
     Identidad Colegio San Carlos
       azul    #00476C   institucional
       rojo    #E4051F   acento del isologo, usado con moderacion
       pizarra #4A6E82   recuadro "DIALOGOS"
     Los colores de estado (activo / en revision / archivado) son
     semanticos y se mantienen aparte de la paleta de marca.
     =========================================================== */
  :root {
    --azul: #00476C;
    --azul-osc: #00334E;
    --azul-tint: #E7F0F5;
    --rojo: #E4051F;
    --pizarra: #4A6E82;
    --fondo: #F4F7F9;
    --panel: #FFFFFF;
    --borde: #D9E3EA;
    --tinta: #102A3A;
    --tinta-2: #5B7585;
    --ok-bg: #E6F4EC;
    --ok-fg: #0B6134;
    --ok-bd: #B5DEC7;
    --rev-bg: #FDF2DD;
    --rev-fg: #7A5207;
    --rev-bd: #EBD4A1;
    --arc-bg: #ECF1F4;
    --arc-fg: #54676F;
    --arc-bd: #D3DFE5;

    --radio:  10px;
    --sombra: 0 1px 2px rgba(16,42,58,.06), 0 6px 16px rgba(16,42,58,.05);
    --serif:  Georgia, "Times New Roman", "Nimbus Roman", serif;
    --sans:   "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* El panel se ve bien tambien si el sistema esta en modo oscuro. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --azul: #5BAAD1;
      --azul-osc: #8CC6E2;
      --azul-tint: #0D3346;
      --rojo: #FF6B74;
      --pizarra: #8FB0C0;
      --fondo: #06202E;
      --panel: #0B2E40;
      --borde: #1C4659;
      --tinta: #E9F2F7;
      --tinta-2: #9FBAC8;
      --ok-bg: #0C3A28;
      --ok-fg: #7FD9AC;
      --ok-bd: #1C6244;
      --rev-bg: #3D2F0C;
      --rev-fg: #F0CE7A;
      --rev-bd: #6B5518;
      --arc-bg: #17303D;
      --arc-fg: #A8BDC8;
      --arc-bd: #2C4E5E;
      --sombra: 0 1px 2px rgba(0,0,0,.35), 0 6px 16px rgba(0,0,0,.25);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }

  .contenedor { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .oculto { display: none !important; }

  /* ---------- Encabezado institucional ---------- */
  header.principal {
    background: var(--panel);
    border-bottom: 3px solid var(--rojo);
  }
  .marca {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 20px 0 18px;
  }
  #logo { height: 62px; width: auto; max-width: 100%; display: block; }
  /* display:block de arriba pisaria el display:none del atributo hidden. */
  #logo[hidden] { display: none; }

  /* Lockup tipográfico: se usa cuando no hay logo.png en la carpeta. */
  .lockup { line-height: 1.05; }
  .lockup .colegio {
    display: block;
    font-family: var(--serif);
    font-size: .78rem;
    letter-spacing: .34em;
    color: var(--azul);
  }
  .lockup .sancarlos {
    display: block;
    font-family: var(--serif);
    font-size: 1.72rem;
    letter-spacing: .04em;
    color: var(--rojo);
  }

  .titulo-sitio {
    padding-left: 18px;
    border-left: 1px solid var(--borde);
  }
  .titulo-sitio h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 1.22rem;
    font-weight: 400;
    color: var(--azul);
    text-wrap: balance;
  }
  .titulo-sitio p { margin: 2px 0 0; color: var(--tinta-2); font-size: .85rem; }

  .meta {
    display: flex;
    gap: 8px 16px;
    flex-wrap: wrap;
    align-items: center;
    padding-bottom: 14px;
    color: var(--tinta-2);
    font-size: .8rem;
  }
  .meta strong { color: var(--tinta); font-weight: 600; }
  .meta .punto { color: var(--borde); }

  /* ---------- Búsqueda ---------- */
  .barra-busqueda {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--fondo);
    border-bottom: 1px solid var(--borde);
    padding: 12px 0;
  }
  .campo { position: relative; display: flex; align-items: center; }
  .campo svg {
    position: absolute;
    left: 13px;
    width: 18px; height: 18px;
    fill: none;
    stroke: var(--tinta-2);
    stroke-width: 2;
    pointer-events: none;
  }
  #buscador {
    width: 100%;
    padding: 11px 42px 11px 41px;
    font: inherit;
    color: var(--tinta);
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #buscador::placeholder { color: var(--tinta-2); }
  #buscador:focus {
    border-color: var(--azul);
    box-shadow: 0 0 0 3px var(--azul-tint);
  }
  #limpiar {
    position: absolute;
    right: 7px;
    width: 30px; height: 30px;
    display: none;
    place-items: center;
    background: transparent;
    border: 0;
    border-radius: 7px;
    color: var(--tinta-2);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
  }
  #limpiar:hover { background: var(--azul-tint); color: var(--azul); }
  #limpiar.visible { display: grid; }
  #contador { margin-top: 7px; min-height: 1.1em; color: var(--tinta-2); font-size: .79rem; }

  /* ---------- Secciones por nivel ---------- */
  main { padding: 4px 0 56px; }

  .seccion { margin-top: 24px; }
  .seccion > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0 10px;
    border-bottom: 1px solid var(--borde);
    user-select: none;
  }
  .seccion > summary::-webkit-details-marker { display: none; }
  .seccion > summary:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; }
  .seccion > summary h2 {
    margin: 0;
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: .01em;
    color: var(--azul);
  }
  .flecha {
    flex: 0 0 auto;
    width: 9px; height: 9px;
    border-right: 2px solid var(--pizarra);
    border-bottom: 2px solid var(--pizarra);
    transform: rotate(-45deg);
    transition: transform .18s ease;
  }
  .seccion[open] > summary .flecha { transform: rotate(45deg); }
  .cuenta {
    margin-left: auto;
    color: var(--tinta-2);
    font-size: .76rem;
    font-variant-numeric: tabular-nums;
  }

  .grilla {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap: 14px;
    padding-top: 16px;
  }

  /* ---------- Tarjetas ---------- */
  .tarjeta {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    transition: border-color .15s ease, transform .15s ease;
  }
  .tarjeta:hover { border-color: var(--pizarra); transform: translateY(-1px); }
  .tarjeta h3 {
    margin: 0;
    font-family: var(--serif);
    font-size: 1.02rem;
    font-weight: 400;
    color: var(--tinta);
  }
  .tarjeta p { margin: 0; flex: 1 1 auto; color: var(--tinta-2); font-size: .85rem; }

  .etiqueta {
    align-self: flex-start;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .etiqueta.activo    { background: var(--ok-bg);  color: var(--ok-fg);  border-color: var(--ok-bd); }
  .etiqueta.revision  { background: var(--rev-bg); color: var(--rev-fg); border-color: var(--rev-bd); }
  .etiqueta.archivado { background: var(--arc-bg); color: var(--arc-fg); border-color: var(--arc-bd); }

  .abrir {
    margin-top: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 14px;
    background: var(--azul);
    color: var(--panel);
    border: 1px solid transparent;
    border-radius: 8px;
    font-size: .87rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .abrir:hover { background: var(--azul-osc); }
  .abrir:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .abrir.pendiente {
    background: transparent;
    color: var(--tinta-2);
    border-color: var(--borde);
    border-style: dashed;
    cursor: not-allowed;
  }
  .abrir .icono { font-size: .95em; line-height: 1; }

  /* ---------- Avisos ---------- */
  .aviso {
    margin-top: 22px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-left: 3px solid var(--rojo);
    border-radius: var(--radio);
    color: var(--tinta-2);
    font-size: .88rem;
  }
  .aviso strong { color: var(--tinta); }
  .aviso code { padding: 1px 5px; background: var(--azul-tint); border-radius: 4px; font-size: .92em; }

  footer.principal {
    border-top: 1px solid var(--borde);
    padding: 18px 0 30px;
    color: var(--tinta-2);
    font-size: .79rem;
  }

  @media (max-width: 560px) {
    .marca { gap: 12px; padding: 16px 0 14px; }
    #logo { height: 48px; }
    .titulo-sitio { padding-left: 0; border-left: 0; }
    .grilla { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="principal">
  <div class="contenedor">
    <div class="marca">
      <!-- Si existe logo.png en esta carpeta se usa el isologo real;
           si no, queda el lockup tipográfico de abajo. -->
      <img id="logo" alt="Colegio San Carlos" hidden>
      <div class="lockup" id="lockup">
        <span class="colegio">COLEGIO</span>
        <span class="sancarlos">SAN CARLOS</span>
      </div>
      <div class="titulo-sitio">
        <h1>Sistemas</h1>
        <p>Panel de acceso rápido a las aplicaciones del colegio</p>
      </div>
    </div>
    <div class="meta">
      <span>Última actualización: <strong id="fecha-actualizacion">—</strong></span>
      <span class="punto" aria-hidden="true">|</span>
      <span id="total-proyectos"></span>
    </div>
  </div>
</header>

<div class="barra-busqueda">
  <div class="contenedor">
    <div class="campo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"></line>
      </svg>
      <label class="oculto" for="buscador">Buscar proyecto por nombre</label>
      <input id="buscador" type="search" autocomplete="off" spellcheck="false"
             placeholder="Buscar proyecto por nombre…" disabled>
      <button id="limpiar" type="button" title="Limpiar búsqueda" aria-label="Limpiar búsqueda">&times;</button>
    </div>
    <div id="contador" role="status" aria-live="polite"></div>
  </div>
</div>

<main class="contenedor">
  <div id="secciones"></div>

  <div id="sin-resultados" class="aviso oculto">
    No hay proyectos que coincidan con la búsqueda.
  </div>

  <div id="error-carga" class="aviso oculto">
    <strong id="error-titulo"></strong>
    <span id="error-detalle"></span>
  </div>
</main>

<footer class="principal">
  <div class="contenedor">
    Colegio San Carlos · Facilitación Tecnológica
  </div>
</footer>

<!--
  Copia de respaldo de los datos.
  Sirve sólo para que la página funcione al abrirla con doble clic (protocolo file://),
  donde el navegador bloquea la lectura de links.json.
  En GitHub Pages (o cualquier servidor) SIEMPRE se usa links.json, así que la fuente
  de verdad es ese archivo. Si querés, podés mantener esta copia sincronizada; si no,
  simplemente ignorala y editá únicamente links.json.
-->
<script type="application/json" id="datos-respaldo">
[
  { "nombre": "Admisión Inicial",      "nivel": "Inicial",      "url": "PEGAR_LINK_AQUI", "descripcion": "Formulario de admisión para nivel inicial", "estado": "activo" },
  { "nombre": "Talleres Inicial",      "nivel": "Inicial",      "url": "PEGAR_LINK_AQUI", "descripcion": "Gestión de talleres extracurriculares",    "estado": "activo" },
  { "nombre": "Admisión Primaria",     "nivel": "Primaria",     "url": "PEGAR_LINK_AQUI", "descripcion": "Formulario de admisión para primaria",     "estado": "activo" },
  { "nombre": "Comedor Primaria",      "nivel": "Primaria",     "url": "PEGAR_LINK_AQUI", "descripcion": "Gestión del comedor escolar",              "estado": "activo" },
  { "nombre": "Talleres Primaria",     "nivel": "Primaria",     "url": "PEGAR_LINK_AQUI", "descripcion": "Gestión de talleres extracurriculares",    "estado": "activo" },
  { "nombre": "Comedor Secundaria",    "nivel": "Secundaria",   "url": "PEGAR_LINK_AQUI", "descripcion": "Gestión del comedor escolar",              "estado": "activo" },
  { "nombre": "Facturación Comedor",   "nivel": "General"     , "url": "PEGAR_LINK_AQUI", "descripcion": "Facturación transversal de comedor",       "estado": "activo" },
  { "nombre": "Facturación Talleres",  "nivel": "General"     , "url": "PEGAR_LINK_AQUI", "descripcion": "Facturación transversal de talleres",      "estado": "activo" }
]
</script>

<script>
(function () {
  "use strict";

  /* =========================================================
     CONFIGURACIÓN
     ========================================================= */

  // Fecha de "última actualización".
  // Dejala vacía ("") para que se calcule sola con la fecha del archivo,
  // o escribila a mano, por ejemplo: "16/09/2026".
  var ULTIMA_ACTUALIZACION = "";

  // Orden y nombre visible de cada sección.
  // La clave se compara con el campo "nivel" del JSON (sin distinguir mayúsculas ni acentos).
  var SECCIONES = [
    { clave: "inicial",      titulo: "Inicial" },
    { clave: "primaria",     titulo: "Primaria" },
    { clave: "secundaria",   titulo: "Secundaria" },
    { clave: "general",      titulo: "General" }
  ];
  var SECCION_POR_DEFECTO = "general"; // cualquier nivel desconocido cae acá

  // Estados admitidos: clase CSS + texto de la etiqueta.
  var ESTADOS = {
    activo:      { clase: "activo",    texto: "Activo" },
    "en revision": { clase: "revision", texto: "En revisión" },
    revision:    { clase: "revision",  texto: "En revisión" },
    archivado:   { clase: "archivado", texto: "Archivado" }
  };
  var ESTADO_POR_DEFECTO = { clase: "revision", texto: "Sin estado" };

  var URL_PENDIENTE = "PEGAR_LINK_AQUI";

  /* =========================================================
     UTILIDADES
     ========================================================= */

  var $ = function (sel) { return document.querySelector(sel); };

  function normalizar(texto) {
    return String(texto == null ? "" : texto)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")  // saca acentos
      .trim();
  }

  function esc(texto) {
    return String(texto == null ? "" : texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function urlSegura(url) {
    var limpia = String(url == null ? "" : url).trim();
    if (!limpia || limpia === URL_PENDIENTE) return "";
    return /^https?:\/\//i.test(limpia) ? limpia : "";
  }

  function plural(n, sing, plu) { return n === 1 ? sing : plu; }

  /* =========================================================
     RENDERIZADO
     ========================================================= */

  var contenedorSecciones = $("#secciones");
  var inputBusqueda = $("#buscador");
  var botonLimpiar = $("#limpiar");
  var contador = $("#contador");
  var avisoSinResultados = $("#sin-resultados");

  var tarjetas = [];   // { nodo, nombreNormalizado, seccion }
  var gruposDom = [];  // { detalle, grilla, contadorNodo, visibles, total }

  function crearTarjeta(proyecto) {
    var nombre = proyecto.nombre || "Sin nombre";
    var estado = ESTADOS[normalizar(proyecto.estado)] || ESTADO_POR_DEFECTO;
    var url = urlSegura(proyecto.url);

    var art = document.createElement("article");
    art.className = "tarjeta";

    var boton = url
      ? '<a class="abrir" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
          'Abrir <span class="icono" aria-hidden="true">&#8599;</span>' +
        '</a>'
      : '<span class="abrir pendiente" title="Todavía no se cargó el link de esta app">Link pendiente</span>';

    art.innerHTML =
      '<span class="etiqueta ' + estado.clase + '">' + esc(estado.texto) + '</span>' +
      '<h3>' + esc(nombre) + '</h3>' +
      '<p>' + esc(proyecto.descripcion || "") + '</p>' +
      boton;

    return art;
  }

  function render(proyectos) {
    contenedorSecciones.innerHTML = "";
    tarjetas = [];
    gruposDom = [];

    // Reparto de proyectos por sección, respetando el orden de SECCIONES.
    var clavesValidas = {};
    SECCIONES.forEach(function (s) { clavesValidas[s.clave] = []; });

    proyectos.forEach(function (p) {
      var clave = normalizar(p.nivel);
      if (!Object.prototype.hasOwnProperty.call(clavesValidas, clave)) {
        clave = SECCION_POR_DEFECTO;
      }
      clavesValidas[clave].push(p);
    });

    SECCIONES.forEach(function (seccion) {
      var items = clavesValidas[seccion.clave];
      if (!items.length) return;   // secciones vacías no se muestran

      var detalle = document.createElement("details");
      detalle.className = "seccion";
      detalle.open = true;

      var resumen = document.createElement("summary");
      resumen.innerHTML =
        '<span class="flecha" aria-hidden="true"></span>' +
        '<h2>' + esc(seccion.titulo) + '</h2>' +
        '<span class="cuenta">' + items.length + '</span>';
      detalle.appendChild(resumen);

      var grilla = document.createElement("div");
      grilla.className = "grilla";
      detalle.appendChild(grilla);

      var grupo = {
        detalle: detalle,
        contadorNodo: resumen.querySelector(".cuenta"),
        total: items.length,
        visibles: items.length
      };

      items.forEach(function (p) {
        var nodo = crearTarjeta(p);
        grilla.appendChild(nodo);
        tarjetas.push({
          nodo: nodo,
          nombre: normalizar(p.nombre),
          grupo: grupo
        });
      });

      gruposDom.push(grupo);
      contenedorSecciones.appendChild(detalle);
    });

    $("#total-proyectos").textContent =
      proyectos.length + " " + plural(proyectos.length, "proyecto", "proyectos");

    inputBusqueda.disabled = false;
    filtrar("");
  }

  /* =========================================================
     BÚSQUEDA
     ========================================================= */

  function filtrar(texto) {
    var consulta = normalizar(texto);

    gruposDom.forEach(function (g) { g.visibles = 0; });

    var visibles = 0;
    tarjetas.forEach(function (t) {
      var coincide = !consulta || t.nombre.indexOf(consulta) !== -1;
      t.nodo.classList.toggle("oculto", !coincide);
      if (coincide) {
        visibles++;
        t.grupo.visibles++;
      }
    });

    gruposDom.forEach(function (g) {
      g.detalle.classList.toggle("oculto", g.visibles === 0);
      g.contadorNodo.textContent = consulta ? g.visibles + "/" + g.total : g.total;
      if (consulta && g.visibles > 0) g.detalle.open = true;
    });

    avisoSinResultados.classList.toggle("oculto", visibles > 0 || !tarjetas.length);
    botonLimpiar.classList.toggle("visible", !!consulta);

    contador.textContent = consulta
      ? visibles + " " + plural(visibles, "resultado", "resultados") + " para “" + texto.trim() + "”"
      : "";
  }

  inputBusqueda.addEventListener("input", function () { filtrar(this.value); });
  inputBusqueda.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && this.value) {
      this.value = "";
      filtrar("");
    }
  });
  botonLimpiar.addEventListener("click", function () {
    inputBusqueda.value = "";
    filtrar("");
    inputBusqueda.focus();
  });

  /* =========================================================
     FECHA
     ========================================================= */

  function ponerFecha() {
    var destino = $("#fecha-actualizacion");
    if (ULTIMA_ACTUALIZACION) {
      destino.textContent = ULTIMA_ACTUALIZACION;
      return;
    }
    var fecha = new Date(document.lastModified);
    destino.textContent = isNaN(fecha.getTime())
      ? "—"
      : fecha.toLocaleDateString("es-AR", { day: "2-digit", month: "long", year: "numeric" });
  }

  /* =========================================================
     CARGA DE DATOS
     ========================================================= */

  function datosDeRespaldo() {
    try {
      return JSON.parse($("#datos-respaldo").textContent);
    } catch (e) {
      return null;
    }
  }

  var AVISO_RESPALDO =
    " Mientras tanto se muestra la copia de respaldo incluida en el HTML, " +
    "que puede estar desactualizada.";

  function mostrarAviso(titulo, detalle) {
    $("#error-titulo").textContent = titulo;
    $("#error-detalle").textContent = detalle || "";
    $("#error-carga").classList.remove("oculto");
  }

  function pintar(proyectos) {
    if (!Array.isArray(proyectos)) return false;
    render(proyectos);
    return true;
  }

  // Un solo lugar para decidir qué hacer cuando links.json no se pudo usar.
  function alFallar(titulo, detalle) {
    var respaldo = datosDeRespaldo();
    if (respaldo && pintar(respaldo)) {
      mostrarAviso(titulo, (detalle ? detalle + " " : "") + AVISO_RESPALDO.trim());
    } else {
      mostrarAviso(titulo, detalle || "");
    }
  }

  ponerFecha();

  // Bandera para distinguir "no se pudo bajar el archivo" de "el archivo está mal escrito".
  var seDescargo = false;

  // El parámetro ?v= evita que el navegador sirva una versión cacheada al editar links.json.
  fetch("links.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("El servidor respondió HTTP " + r.status + ".");
      seDescargo = true;
      return r.text();
    })
    .then(function (texto) {
      var datos;
      try {
        datos = JSON.parse(texto);
      } catch (e) {
        throw new Error("Error de sintaxis JSON: " + e.message);
      }
      if (!pintar(datos)) {
        throw new Error("El archivo debe contener una lista (un array) de proyectos.");
      }
    })
    .catch(function (err) {
      if (seDescargo) {
        // El archivo existe pero tiene un problema: hay que arreglarlo sí o sí.
        alFallar("links.json se encontró, pero no se pudo leer.", err.message);
      } else if (location.protocol === "file:") {
        alFallar(
          "Estás abriendo la página con doble clic (file://).",
          "El navegador no permite leer links.json de esta forma; en GitHub Pages se lee sin problema."
        );
      } else {
        alFallar(
          "No se pudo cargar links.json.",
          "Verificá que el archivo esté junto a index.html. (" + err.message + ")"
        );
      }
    });
})();
</script>
<script>
// Usa logo.png si está en la misma carpeta; si no, deja el lockup tipográfico.
(function () {
  var img = document.getElementById("logo");
  var lockup = document.getElementById("lockup");
  if (!img || !lockup) return;
  img.addEventListener("load", function () {
    img.hidden = false;
    lockup.hidden = true;
  });
  img.src = "logo.png";
})();
</script>
